name: CD — Production Deploy

on:
  push:
    branches: [production]

jobs:
  # ────────────────────────────────────────────────────────
  # Deploy Frontend → Vercel
  # ────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend

      - name: Build for production
        run: npm run build
        working-directory: Frontend
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token:      ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:     ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: Frontend
          vercel-args:       --prod

  # ────────────────────────────────────────────────────────
  # Deploy Backend → Railway
  # ────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service lazycv-backend --detach
        working-directory: Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ────────────────────────────────────────────────────────
  # Post-deploy production smoke (quick sanity check)
  # ────────────────────────────────────────────────────────
  post-deploy-smoke:
    name: Post-Deploy Smoke
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    steps:
      - name: Check backend health
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PROD_API_URL }}/api/auth/me)
          # 401 means server is up and auth is working (no cookie = correct)
          [ "$CODE" = "401" ] && echo "✓ Backend live" || (echo "✗ Backend unreachable — got $CODE" && exit 1)

      - name: Check frontend is live
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PROD_FRONTEND_URL }})
          [ "$CODE" = "200" ] && echo "✓ Frontend live" || (echo "✗ Frontend unreachable — got $CODE" && exit 1)
