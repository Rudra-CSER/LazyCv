name: CD — Production Deploy (Docker + VPS)

on:
  push:
    branches: [production]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE:  ghcr.io/rudra-cser/lazycv-backend
  FRONTEND_IMAGE: ghcr.io/rudra-cser/lazycv-frontend

jobs:
  # ────────────────────────────────────────────────────────
  # Build & push Docker images to GitHub Container Registry
  # ────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided by GitHub

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Backend image
        uses: docker/build-push-action@v5
        with:
          context:   ./Backend
          file:      ./Backend/Dockerfile
          push:      true
          tags:      ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context:   ./Frontend
          file:      ./Frontend/Dockerfile
          push:      true
          tags:      ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ────────────────────────────────────────────────────────
  # SSH into VPS and pull + restart containers
  # ────────────────────────────────────────────────────────
  deploy-to-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          source:   docker-compose.yml
          target:   /opt/lazycv

      - name: Pull new images & restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/lazycv

            # Log in to ghcr.io on the VPS (uses a Personal Access Token)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u rudra-cser --password-stdin

            # Pull latest images
            docker compose pull

            # Restart with zero-downtime rolling update
            docker compose up -d --remove-orphans

            # Clean up old dangling images
            docker image prune -f

  # ────────────────────────────────────────────────────────
  # Post-deploy health check
  # ────────────────────────────────────────────────────────
  post-deploy-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy-to-vps

    steps:
      - name: Wait 15 s for containers to start
        run: sleep 15

      - name: Check backend health (401 = server is up, auth working)
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.VPS_HOST }}/api/auth/me)
          [ "$CODE" = "401" ] \
            && echo "✓ Backend healthy (got expected 401)" \
            || (echo "✗ Backend unreachable — got $CODE" && exit 1)

      - name: Check frontend is serving
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.VPS_HOST }})
          [ "$CODE" = "200" ] \
            && echo "✓ Frontend healthy" \
            || (echo "✗ Frontend unreachable — got $CODE" && exit 1)
