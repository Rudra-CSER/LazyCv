name: CD — Production Deploy (Render)

on:
  push:
    branches: [production]

permissions: {}

jobs:
  trigger-render-deploy:
    name: Trigger Render Deploy Hooks
    runs-on: ubuntu-latest

    steps:
      - name: Trigger backend deploy hook
        env:
          BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          test -n "$BACKEND_DEPLOY_HOOK" || (echo "Missing RENDER_BACKEND_DEPLOY_HOOK secret" && exit 1)
          curl -fsS -X POST "$BACKEND_DEPLOY_HOOK"

      - name: Trigger frontend deploy hook
        env:
          FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          test -n "$FRONTEND_DEPLOY_HOOK" || (echo "Missing RENDER_FRONTEND_DEPLOY_HOOK secret" && exit 1)
          curl -fsS -X POST "$FRONTEND_DEPLOY_HOOK"

  post-deploy-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: trigger-render-deploy

    steps:
      - name: Wait for Render deployment
        run: sleep 60

      - name: Check backend health (expect 401 without cookie)
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          test -n "$RENDER_BACKEND_URL" || (echo "Missing RENDER_BACKEND_URL secret" && exit 1)
          for i in {1..20}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "$RENDER_BACKEND_URL/api/auth/get-me")
            if [ "$CODE" = "401" ]; then
              echo "✓ Backend healthy (got expected 401)"
              exit 0
            fi
            echo "Backend not ready yet (status $CODE), retry $i/20"
            sleep 15
          done
          echo "✗ Backend failed health check"
          exit 1

      - name: Check frontend is serving
        env:
          RENDER_FRONTEND_URL: ${{ secrets.RENDER_FRONTEND_URL }}
        run: |
          test -n "$RENDER_FRONTEND_URL" || (echo "Missing RENDER_FRONTEND_URL secret" && exit 1)
          for i in {1..20}; do
            CODE=$(curl -L -s -o /dev/null -w "%{http_code}" \
              "$RENDER_FRONTEND_URL")
            if [ "$CODE" = "200" ]; then
              echo "✓ Frontend healthy"
              exit 0
            fi
            echo "Frontend not ready yet (status $CODE), retry $i/20"
            sleep 15
          done
          echo "✗ Frontend failed health check"
          exit 1
